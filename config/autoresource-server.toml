#Energy Generator Settings
[Energy]

	[Energy.FE]
		#Control the minimum rate of production.
		# Default: 1
		# Range: 1 ~ 9223372036854775807
		min = 1
		#Control the maximum rate of production.
		# Default: 9223372036854775807
		# Range: 1 ~ 9223372036854775807
		max = 9223372036854775807
		#Control the number of seconds it takes to increase production each time.
		# Default: 1
		# Range: 1 ~ 9223372036854775807
		second = 1
		#Control the numerical increase in production each time.
		# Default: 1
		# Range: 0 ~ 9223372036854775807
		step = 1
		#The item that boosts the growth rate. When placed in the boost slot, each increase becomes 1% of the current output. Use item registry name, e.g. minecraft:nether_star.
		star_item = "minecraft:nether_star"
		#Bypass the energy capacity/receive limits of third-party machines (e.g. Mekanism, Thermal, Draconic Evolution) by directly refilling their internal energy to full when they reject the FE. Default: true.
		bypass_enabled = true

